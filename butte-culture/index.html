.slot,.obj{cursor:pointer}

.hist{font-size:12px;border-top:1px solid #eee;padding:4px 0}
.thumbs img{height:60px;border-radius:4px;margin:2px;cursor:zoom-in}
.warn{background:#fff3c4;border:1px solid #e6cf7a;border-radius:6px;padding:6px;margin:6px 0}
.err{background:#fde7e5;border:1px solid #e0a8a4;border-radius:6px;padding:6px;margin:6px 0}

svg.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;background:none}
.emo button{font-size:16px;padding:1px 5px;margin:1px}
.mchk{display:inline-flex;align-items:center;gap:1px;margin-right:6px;font-size:12px;color:#2b2b2b;margin-top:0}

async function migrate(){
  const t=await grist.docApi.fetchTable(TB.plantes);
  const miss=COLS.plantes.filter(c=>!(c[0] in t)).map(c=>['AddColumn',TB.plantes,c[0],{type:c[1]}]);
  if(miss.length)await act(miss);
  const cf=Object.fromEntries((await load(TB.config)).map(r=>[r.Cle,r]));
  const setCfg=(k,v)=>cf[k]?['UpdateRecord',TB.config,cf[k].id,{Valeur:v}]:['AddRecord',TB.config,null,{Cle:k,Valeur:v}];
  const acts=[];
  if(!cf.catalog_v||+cf.catalog_v.Valeur<2){
    const rows=await load(TB.plantes);const by=Object.fromEntries(rows.map(r=>[r.Nom,r]));const add=[];
    PLANTES.map(mk).forEach(o=>{
      const r=by[o.Nom];
      if(!r){add.push(o);return;}
      const patch={};
      ['Qte_4pers','Espacement','Entre_rangs'].forEach(k=>{if(!r[k]&&o[k])patch[k]=o[k];});
      if(r.Emoji==='🫘'||r.Emoji==='🫛'||!r.Emoji)patch.Emoji=o.Emoji;
      if(Object.keys(patch).length)acts.push(['UpdateRecord',TB.plantes,r.id,patch]);
    });
    if(add.length)acts.push(bulk(TB.plantes,add,COLS.plantes.map(c=>c[0])));
    acts.push(setCfg('catalog_v','2'));
  }
  if(!cf.plan_v||+cf.plan_v.Valeur<2){
    const ja=await load(TB.jardin);

      acts.push(['AddRecord',TB.jardin,null,{Type:'terrain',Nom:'Jardin devant (ouest)',X:200,Y:200,W:1200,H:2000,Angle:0}]);
      acts.push(['AddRecord',TB.jardin,null,{Type:'maison_rdc',Nom:'Maison (RDC)',X:1400,Y:640,W:992,H:1110,Angle:0}]);
      acts.push(['AddRecord',TB.jardin,null,{Type:'terrain',Nom:'Jardin derrière (est)',X:2392,Y:200,W:1200,H:2000,Angle:0}]);
    }
    if(+((cf.jardin_w||{}).Valeur||15)<40)acts.push(setCfg('jardin_w','40'));
    if(+((cf.jardin_h||{}).Valeur||10)<24)acts.push(setCfg('jardin_h','24'));
    acts.push(setCfg('plan_v','2'));
  }
  if(!cf.todoist_url)acts.push(setCfg('todoist_url',TODO_DEF));
  if(acts.length)await act(acts);
}

let _tok=null;
async function tok(){
  if(_tok&&Date.now()<_tok.exp)return _tok;
  const t=await grist.docApi.getAccessToken({readOnly:false});
  _tok={baseUrl:t.baseUrl,token:t.token,exp:Date.now()+Math.max(60000,(t.ttlMsecs||300000)-30000)};
  return _tok;
}
function shrink(file){
  return new Promise(res=>{
    if(!file.type.startsWith('image/'))return res(file);
    const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,1600/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file);},'image/jpeg',0.82);
    };
    img.onerror=()=>res(file);img.src=u;
  });
}
async function upload(files){
  const t=await tok();const fd=new FormData();
  for(const f of files){const b=await shrink(f);fd.append('upload',b,(f.name||'photo').replace(/\.\w+$/,'')+'.jpg');}
  const r=await fetch(t.baseUrl+'/attachments?auth='+t.token,{method:'POST',body:fd});
  if(!r.ok)throw new Error('Envoi des photos impossible ('+r.status+')');
  return ['L'].concat(await r.json());
}
const attIds=v=>Array.isArray(v)?v.filter(x=>typeof x==='number'):[];
async function fillImgs(){
  const imgs=[...document.querySelectorAll('img[data-att]')];if(!imgs.length)return;
  try{const t=await tok();imgs.forEach(i=>{i.src=t.baseUrl+'/attachments/'+i.dataset.att+'/download?auth='+t.token;});}catch(e){}
}

function lastRec(slot){

  return S.SU.filter(r=>r.Butte===S.butte&&r.Slot===slot.Code&&r.Date>=cs)
    .sort((a,b)=>a.Date<b.Date?1:a.Date>b.Date?-1:b.id-a.id)[0];
}
const COUL={'Semé':'#f2c94c','Planté':'#6fcf97','Récolté':'#f2994a','Retiré':'#bdbdbd','Note':'#9ecbff'};
function nextRecolte(plante,date){
  const p=PM()[plante];if(!p)return '';const ms=mois(p.Mois_recolte);if(!ms.length)return '';
  const d=new Date((date||today())+'T12:00:00');
  for(let i=1;i<=13;i++){const t=new Date(d.getFullYear(),d.getMonth()+i,1);if(ms.includes(t.getMonth()+1))return iso(t);}
  return '';
}
function defAction(slot){
  const r=lastRec(slot);
  if(r&&(r.Action==='Semé'||r.Action==='Planté'))return 'Récolté';
  const p=PM()[slot.Plan];return p&&mois(p.Mois_semis).length?'Semé':'Planté';
}

  if(S.vue!=='Tout'){const key=S.vue==='Devant'?'devant':'derri';const t=S.JA.filter(o=>o.Type==='terrain'&&String(o.Nom).toLowerCase().includes(key));if(t.length)list=t;}
  if(!list.length)return [0,0,gw,gh];
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  list.forEach(o=>{const a=(((o.Angle||0)%180)+180)%180;const sw=a===90?o.H:o.W,sh=a===90?o.W:o.H;const cx=o.X+o.W/2,cy=o.Y+o.H/2;x1=Math.min(x1,cx-sw/2);x2=Math.max(x2,cx+sw/2);y1=Math.min(y1,cy-sh/2);y2=Math.max(y2,cy+sh/2);});
  const m=Math.max(150,(x2-x1)*0.07);
  return [x1-m,y1-m,x2-x1+2*m,y2-y1+2*m];
}
function houseSVG(fs){

  let g=`<g transform="${T}">`;
  g+=`<polygon points="82,195 832,195 832,865 525,865 525,797 82,797" fill="#e9e5da" stroke="#333" stroke-width="2.2" vector-effect="non-scaling-stroke"/>`;

  g+=`<rect x="770" y="435" width="34" height="30" fill="#222"/>`;

  g+='</g>';
  const L=(px,py,t,t2)=>{const p=P(px,py);return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="${fs}" fill="#444" style="pointer-events:none">${t}${t2&&S.cotes?`<tspan x="${p[0]}" dy="${fs*1.2}" font-size="${fs*.8}" fill="${CC}">${t2}</tspan>`:''}</text>`;};
  g+=L(220,330,'Séjour','3,50 × 4,44')+L(468,330,'Salle à manger','3,85 × 3,65')+L(228,650,'Cuisine','3,69 × 3,76')+L(407,610,'Hall','1,55 × 4,55')+L(497,600,'WC')+L(668,520,'Garage','4,00 × 9,40')+L(380,835,'Entrée');
  return g;
}
function cotesObj(o,fs){
  const w=o.W,h=o.H,t=fs*.5,y=-fs*.9,x=-fs*.9,sw=fs/14,ap=o.Type==='maison_rdc'?'≈ ':'';
  const tk=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  return `<g stroke="${CC}" stroke-width="${sw}" fill="none" style="pointer-events:none">${tk(0,y,w,y)}${tk(0,y-t,0,y+t)}${tk(w,y-t,w,y+t)}${tk(x,0,x,h)}${tk(x-t,0,x+t,0)}${tk(x-t,h,x+t,h)}</g><text x="${w/2}" y="${y-fs*.25}" text-anchor="middle" font-size="${fs*.8}" fill="${CC}" style="pointer-events:none">${ap}${fm(w)} m</text><text transform="translate(${x-fs*.25} ${h/2}) rotate(-90)" text-anchor="middle" font-size="${fs*.8}" fill="${CC}" style="pointer-events:none">${ap}${fm(h)} m</text>`;
}
function jardinSVG(){
  const vb=viewBoxFor();const fs=Math.max(14,vb[2]/55);
  let g=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#f1efe4"/>`;
  for(let x=Math.ceil(vb[0]/100)*100;x<vb[0]+vb[2];x+=100)g+=`<line x1="${x}" y1="${vb[1]}" x2="${x}" y2="${vb[1]+vb[3]}" stroke="#e2dfd0" stroke-width="${fs/25}"/>`;
  for(let y=Math.ceil(vb[1]/100)*100;y<vb[1]+vb[3];y+=100)g+=`<line x1="${vb[0]}" y1="${y}" x2="${vb[0]+vb[2]}" y2="${y}" stroke="#e2dfd0" stroke-width="${fs/25}"/>`;
  const objs=S.JA.slice().sort((a,b)=>((LAYER[a.Type]??2)-(LAYER[b.Type]??2))||(a.id-b.id));
  objs.forEach(o=>{
    const w=o.W,h=o.H,sel=S.selG===o.id,a=o.Angle||0,cx=w/2,cy=h/2;
    const col=COL_OBJ[o.Type]||'#ddd',sk=sel?'#1976d2':'#666',sw=sel?fs/4:fs/10;
    let sh;
    if(o.Type==='maison_rdc')sh=houseSVG(Math.min(fs*.6,38))+`<rect width="${w}" height="${h}" fill="transparent" stroke="${sel?'#1976d2':'none'}" stroke-width="${fs/4}"/>`;
    else if(o.Type==='arbre'||o.Type==='eau')sh=`<ellipse cx="${cx}" cy="${cy}" rx="${w/2}" ry="${h/2}" fill="${col}" stroke="${sk}" stroke-width="${sw}"/>`;
    else sh=`<rect width="${w}" height="${h}" rx="${fs/4}" fill="${col}" stroke="${o.Type==='terrain'&&!sel?'#8aa06a':sk}" stroke-width="${sw}" ${o.Type==='allee'?'opacity=".7"':''}/>`;
    if(o.Type==='butte')sh+=`<line x1="${w*.15}" y1="${cy}" x2="${w*.85}" y2="${cy}" stroke="#d2691e" stroke-width="${fs/6}"/>`;
    let lab='';
    if(o.Type==='terrain')lab=`<text x="${fs*.6}" y="${fs*1.6}" font-size="${fs}" fill="#4d6b2a" font-weight="600" style="pointer-events:none">${esc(o.Nom)}</text>`;
    else if(o.Type!=='maison_rdc')lab=`<text transform="rotate(${-a} ${cx} ${cy})" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" style="pointer-events:none">${esc(o.Nom)}</text>`;
    g+=`<g class="obj" data-obj="${o.id}" transform="translate(${o.X} ${o.Y})"><g transform="rotate(${a} ${cx} ${cy})">${sh}${lab}${S.cotes?cotesObj(o,fs):''}</g></g>`;
  });
  g+=`<g transform="translate(${vb[0]+vb[2]-fs*2.5} ${vb[1]+fs*4})" style="pointer-events:none"><polygon points="0,${-fs*2} ${fs*.7},0 ${-fs*.7},0" fill="#333"/><text y="${fs*1.4}" text-anchor="middle" font-size="${fs*1.2}" font-weight="700">N</text></g>`;
  return `<svg id="svg" class="${S.edit?'edit':''}" viewBox="${vb.join(' ')}">${g}</svg>`;
}

  if(t.dataset.delsu){if(confirm('Supprimer cette entrée ?'))run(async()=>{await act([['RemoveRecord',TB.suivi,+t.dataset.delsu]]);await reload();});return;}
  if(t.dataset.delra){run(async()=>{await act([['RemoveRecord',TB.rappels,+t.dataset.delra]]);await reload();});return;}
  const a=t.dataset.act;if(!a)return;
  const A={
    toggleEdit(){S.edit=!S.edit;render();},
    toggleCotes(){S.cotes=!S.cotes;try{localStorage.setItem('butte_cotes',S.cotes?'1':'0');}catch(e){}render();},
    newPlante(){S.pe='new';render();},

      const rec={Nom:nom,Emoji:$('p_emoji').value.trim()||'🌱',Type:$('p_type').value,Mois_semis:ms('s'),Mois_plantation:ms('p'),Mois_recolte:ms('r'),Qte_4pers:$('p_qte').value,Espacement:$('p_esp').value,Entre_rangs:$('p_rang').value,Notes:$('p_notes').value};
      if(S.pe==='new'){

    },
    async delPlante(){const p=S.P.find(x=>x.id===S.pe);if(!p||!confirm('Supprimer « '+p.Nom+' » du catalogue ?'))return;await act([['RemoveRecord',TB.plantes,S.pe]]);S.pe=null;await reload();},

    async saveObj(){await act([['UpdateRecord',TB.jardin,S.selG,{Nom:$('o_nom').value,W:+$('o_w').value,H:+$('o_h').value,Angle:+$('o_a').value}]]);await reload();},
    async rotObj(){const o=S.JA.find(x=>x.id===S.selG);await act([['UpdateRecord',TB.jardin,S.selG,{Angle:((o.Angle||0)+90)%360}]]);await reload();},
    async delObj(){const o=S.JA.find(x=>x.id===S.selG);if(!confirm('Supprimer « '+o.Nom+' » du plan ?'))return;await act([['RemoveRecord',TB.jardin,S.selG]]);S.selG=null;await reload();},
    openButte(){const o=S.JA.find(x=>x.id===S.selG);S.butte=o.Nom;S.tab='butte';S.edit=false;render();},
    async addRappel(){const t=$('r_txt').value.trim();if(!t)return;await act([['AddRecord',TB.rappels,null,{Date:$('r_date').value||today(),Texte:t,Butte:'',Fait:false}]]);await reload();}
  }[a];
  if(A)run(async()=>{await A();});
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sel_butte'){S.butte=t.value;S.sel=null;return render();}
  if(t.id==='c_todo'){const r=S.CF.find(c=>c.Cle==='todoist_url');run(async()=>{await act([r?['UpdateRecord',TB.config,r.id,{Valeur:t.value}]:['AddRecord',TB.config,null,{Cle:'todoist_url',Valeur:t.value}]]);await reload();});return;}
  if(t.dataset.fait){run(async()=>{await act([['UpdateRecord',TB.rappels,+t.dataset.fait,{Fait:t.checked}]]);await reload();});return;}
  if(t.id==='c_w'||t.id==='c_h'){
    const k=t.id==='c_w'?'jardin_w':'jardin_h';const r=S.CF.find(c=>c.Cle===k);
    run(async()=>{await act([r?['UpdateRecord',TB.config,r.id,{Valeur:t.value}]:['AddRecord',TB.config,null,{Cle:k,Valeur:t.value}]]);await reload();});return;
  }
  if(t.id==='f_plante'||t.id==='f_action'||t.id==='f_date'){
    const p=$('f_plante').value,a=$('f_action').value,d=$('f_date').value;
    const nr=nextRecolte(p,d);$('f_rdate').value=nr;$('f_rchk').checked=!!nr&&(a==='Semé'||a==='Planté');
  }
});
document.addEventListener('input',e=>{if(e.target.id==='p_search'){S.q=e.target.value;const el=$('ptable');if(el)el.innerHTML=tablePlantes();}});
/* Glisser-déposer en mode modification */
let drag=null;
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
document.addEventListener('pointerdown',e=>{
  if(!S.edit)return;
  const g=e.target.closest&&e.target.closest('[data-slot],[data-obj]');if(!g)return;
  const isSlot=g.dataset.slot!==undefined;const id=+(isSlot?g.dataset.slot:g.dataset.obj);
  const rec=(isSlot?S.SL:S.JA).find(r=>r.id===id);const svg=g.ownerSVGElement;const p=svgPt(svg,e);
  drag={g,svg,isSlot,id,rec,p0:p,x0:rec.X,y0:rec.Y,moved:false};e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const p=svgPt(drag.svg,e);const snap=drag.isSlot?1:10;
  const dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;if(!drag.moved)return;
  drag.rec.X=Math.round((drag.x0+dx)/snap)*snap;drag.rec.Y=Math.round((drag.y0+dy)/snap)*snap;
  drag.g.setAttribute('transform','translate('+drag.rec.X+' '+drag.rec.Y+')');
});
document.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.moved){run(async()=>{await act([['UpdateRecord',d.isSlot?TB.slots:TB.jardin,d.id,{X:d.rec.X,Y:d.rec.Y}]]);if(d.isSlot)S.sel=d.id;else S.selG=d.id;await reload();});}
  else{if(d.isSlot)S.sel=d.id;else S.selG=d.id;render();}
});

/* ---------- Démarrage ---------- */
grist.ready({requiredAccess:'full'});
(async()=>{
  try{await ensure();await reload();}catch(e){S.err='Initialisation impossible : '+((e&&e.message)||e);}
  render();
})();
</script>
